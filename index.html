<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenith Giveaway — Key Giveaway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg-top: #fbfaff;
      --bg-mid: #f3eeff;
      --bg-bot: #eae3ff;
      --surface: rgba(255, 255, 255, 0.92);
      --surface-solid: #ffffff;
      --surface-hover: #ffffff;
      --border: rgba(124, 58, 237, 0.16);
      --border-strong: rgba(124, 58, 237, 0.42);
      --text: #17112b;
      --text-muted: #5e5480;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.26);
      --accent-2: #6d28d9;
      --success: #16a34a;
      --danger: #dc2626;
      --warn: #d97706;
      --radius: 18px;
      --font-sans: 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    /* Glass Pop-up Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(3, 3, 8, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      animation: fadeIn 0.18s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.93) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      border-radius: 22px;
      padding: 26px 24px 22px;
      background: rgba(14, 12, 26, 0.94);
      border: 1px solid var(--border-strong);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65), 0 0 40px var(--accent-glow);
      position: relative;
      animation: modalPop 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
      text-align: center;
    }

    .modal-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18%;
      right: 18%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-2), #60a5fa, transparent);
      border-radius: 999px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s;
    }

    .modal-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .modal-title {
      margin: 6px 0 8px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-body {
      color: var(--text-muted);
      font-size: 0.93rem;
      line-height: 1.6;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
      background-attachment: fixed;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background: transparent;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }

    /* Top centered navbar */
    .navbar-wrap {
      display: flex;
      justify-content: center;
      padding: 18px 16px 8px;
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(251, 250, 255, 0.9) 0%, rgba(251, 250, 255, 0.35) 100%);
    }

    .navbar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 8px 14px 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(109, 40, 217, 0.1);
      flex-wrap: wrap;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: 0.02em;
      color: var(--text);
      padding-right: 8px;
      border-right: 1px solid var(--border);
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.18s ease;
    }

    .nav-link:hover {
      color: var(--accent-2);
      background: rgba(124, 58, 237, 0.08);
    }

    .nav-link.active {
      color: #fff;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.28);
    }

    /* Setup & Error Banners */
    .banner {
      margin: 18px auto 0;
      padding: 14px 18px;
      border-radius: var(--radius);
      border: 1px solid rgba(217, 119, 6, 0.35);
      background: #fffbeb;
      color: #92400e;
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .banner.error {
      border-color: rgba(220, 38, 38, 0.35);
      background: #fef2f2;
      color: #991b1b;
    }

    .banner.success {
      border-color: rgba(22, 163, 74, 0.35);
      background: #f0fdf4;
      color: #166534;
    }

    .banner code {
      font-family: var(--font-mono);
      background: rgba(124, 58, 237, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.86em;
    }

    /* Home Grid */
    .page-header {
      text-align: center;
      margin: 22px 0 28px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .page-header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.96rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .card.clickable {
      cursor: pointer;
    }

    .card.clickable:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: #ede9fe;
      color: #5b21b6;
      border: 1px solid rgba(124, 58, 237, 0.22);
      width: fit-content;
    }

    .pill.open {
      background: #dcfce7;
      color: #15803d;
      border-color: rgba(22, 163, 74, 0.28);
    }

    .pill.closed {
      background: #fee2e2;
      color: #b91c1c;
      border-color: rgba(220, 38, 38, 0.25);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: #f5f3ff;
      border: 1px solid rgba(124, 58, 237, 0.14);
    }

    .card-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .card-meta {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(124, 58, 237, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      object-fit: cover;
      background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
      border: 1px solid var(--border);
      transition: transform 0.25s ease;
    }

    .card.clickable:hover .card-cover {
      transform: scale(1.02);
    }

    /* Rexzy-style Marquee, Hero, Stats */
    .marquee-bar {
      overflow: hidden;
      border-radius: 12px;
      background: linear-gradient(90deg, #7c3aed 0%, #5b21b6 100%);
      color: #fff;
      padding: 9px 0;
      margin-bottom: 18px;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.24);
    }

    .marquee-track {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: marqueeScroll 22s linear infinite;
    }

    @keyframes marqueeScroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 32px 26px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 55%, #ede9fe 100%);
      border: 1px solid var(--border-strong);
      box-shadow: 0 18px 46px rgba(109, 40, 217, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-card h1 {
      margin: 8px 0 8px;
      font-size: clamp(1.55rem, 3.2vw, 2.2rem);
      line-height: 1.2;
      color: var(--text);
    }

    .hero-card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.96rem;
      max-width: 520px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 8px 24px rgba(109, 40, 217, 0.06);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-val {
      margin-top: 4px;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-2);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 600px) {
      .stats-row {
        grid-template-columns: 1fr;
      }
    }

    /* Detail View */
    .detail-wrap {
      max-width: 520px;
      margin: 20px auto 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: var(--accent-2);
    }

    .detail-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 26px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: 0 24px 60px rgba(109, 40, 217, 0.14);
      backdrop-filter: blur(12px);
    }

    .detail-title {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.25;
    }

    /* Ring */
    .ring-box {
      position: relative;
      width: 176px;
      height: 176px;
      margin: 6px 0;
      display: grid;
      place-items: center;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(147, 167, 204, 0.14);
      stroke-width: 10;
    }

    .ring-fg {
      fill: none;
      stroke: var(--accent-2);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease, stroke 0.3s ease;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .ring-fg.empty {
      stroke: var(--danger);
      filter: none;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ring-num {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .ring-sub {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .detail-chips {
      justify-content: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-primary {
      width: 100%;
      max-width: 300px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #fff;
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(124, 58, 237, 0.42);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      background: #ede9fe;
      box-shadow: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 0.84rem;
      border-radius: 9px;
      background: #f5f3ff;
      color: #5b21b6;
      border: 1px solid rgba(124, 58, 237, 0.24);
    }

    .btn-sm:hover {
      background: #7c3aed;
      color: #fff;
    }

    .btn-danger {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid rgba(220, 38, 38, 0.25);
    }

    .btn-danger:hover {
      background: #dc2626;
      color: #fff;
    }

    /* Ended Dashed Box */
    .ended-box {
      width: 100%;
      padding: 18px 16px;
      border-radius: 14px;
      border: 1.5px dashed rgba(124, 58, 237, 0.3);
      background: #faf8ff;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .ended-box strong {
      display: block;
      color: var(--text);
      font-size: 0.98rem;
      margin-bottom: 4px;
    }

    /* Claimed Result Box */
    .claimed-box {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(22, 163, 74, 0.35);
      background: #f0fdf4;
      text-align: left;
    }

    .key-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f5f3ff;
      border: 1px solid var(--border);
    }

    .key-code {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: #4c1d95;
      word-break: break-all;
    }

    /* Inbox & Admin Lists */
    .stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 680px;
      margin: 0 auto;
    }

    .inbox-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
    }

    .inbox-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .inbox-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .inbox-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Forms */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .field label {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input,
    .textarea {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-family: inherit;
      font-size: 0.94rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input:focus,
    .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    .textarea {
      min-height: 120px;
      resize: vertical;
      font-family: var(--font-mono);
      font-size: 0.86rem;
    }

    .input:focus,
    .textarea:focus {
      border-color: var(--accent-2);
    }

    .admin-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 46px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .muted {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* Rexzy-style ambient glow, grid, animations, skeleton, toast */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(620px circle at 15% 10%, rgba(167, 139, 250, 0.25), transparent 60%),
        radial-gradient(520px circle at 85% 20%, rgba(196, 181, 253, 0.28), transparent 62%),
        radial-gradient(600px circle at 50% 95%, rgba(139, 92, 246, 0.16), transparent 65%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(124, 58, 237, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.045) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at 50% 30%, #000 35%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 35%, transparent 85%);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .card,
    .detail-card,
    .inbox-item,
    .form-card {
      animation: fadeUp 0.28s ease both;
      position: relative;
      overflow: hidden;
    }

    .card.clickable::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(280px circle at 50% 0%, rgba(96, 165, 250, 0.14), transparent 70%);
      opacity: 0;
      transition: opacity 0.22s ease;
      pointer-events: none;
    }

    .card.clickable:hover {
      transform: translateY(-4px);
      border-color: var(--border-strong);
      box-shadow: 0 18px 42px rgba(124, 58, 237, 0.16), 0 0 0 1px rgba(124, 58, 237, 0.15);
    }

    .card.clickable:hover::before {
      opacity: 1;
    }

    .btn-primary {
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.24), transparent);
      transform: skewX(-20deg);
      transition: left 0.5s ease;
      pointer-events: none;
    }

    .btn-primary:hover:not(:disabled)::after {
      left: 140%;
    }

    .skeleton-card {
      height: 175px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(90deg, #f3eeff 25%, #e9d5ff 50%, #f3eeff 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }

    .toast-wrap {
      position: fixed;

      border-radius: 12px;

      font-weight: 600;
      box-shadow: 0 14px 32px rgba(109, 40, 217, 0.18);
      animation: fadeUp 0.2s ease both;

    .toast.error {
      border-color: rgba(220, 38, 38, 0.45);

<body>
  <header class="navbar-wrap">
    <nav class="navbar" aria-label="Primary">
      <a href="#" class="brand">
        <span class="brand-dot"></span>
        <span>ZENITH DROPS</span>
      </a>
      <div class="nav-links">
        <a href="#" class="nav-link" data-nav="prizes">Prizes</a>
        <a href="#inbox" class="nav-link" data-nav="inbox">Inbox</a>
        <a href="#admin" class="nav-link" data-nav="admin">Admin</a>

      <div id="navAuthArea" style="display:flex; align-items:center; gap:8px;"></div>
    </nav>
  </header>

  <main class="container" id="app">
    <div class="empty-state">กำลังโหลด...</div>
  </main>
  <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      initializeAppCheck,
      ReCaptchaV3Provider
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInAnonymously,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      orderBy,
      onSnapshot,
      runTransaction,
      writeBatch,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // =========================================================================
    // ตั้งค่า Firebase และอีเมลแอดมินตรงนี้ (ห้ามใส่รหัสผ่านไว้ในโค้ด)
    // =========================================================================
    const ADMIN_EMAIL = "zenithhub42@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyAF_GsB5oph-UHEBULnVlMdLtxfLxvwvoA",
      authDomain: "zenith-drops.firebaseapp.com",
      projectId: "zenith-drops",
      storageBucket: "zenith-drops.firebasestorage.app",
      messagingSenderId: "269019280004",
      appId: "1:269019280004:web:fc586c37568af186d788d1",
      measurementId: "G-HJKP87TT80"
    };

    // Discord Client ID สำหรับปุ่ม "เชื่อมต่อ Discord" (ใช้ร่วมกับสุ่มผู้โชคดี)
    const DISCORD_CLIENT_ID = "1520405120091816077";

    // (ตัวเลือกเสริม) ใส่ Site Key ของ reCAPTCHA v3 เพื่อเปิด Firebase App Check กันบอท
    const RECAPTCHA_SITE_KEY = "";
    // =========================================================================

    const COOLDOWN_MS = 24 * 60 * 60 * 1000;
    const appEl = document.getElementById("app");

    const isConfigured = Boolean(
      firebaseConfig.apiKey &&
      firebaseConfig.projectId &&
      !firebaseConfig.apiKey.includes("YOUR_") &&
      !firebaseConfig.projectId.includes("YOUR_")
    );

    const state = {
      user: null,
      authReady: false,
      giveaways: [],
      giveawaysLoaded: false,
      inbox: [],
      lastClaimMs: 0,
      lastClaimedResult: null,
      statusMsg: null, // { type: 'error' | 'success', text: string }
      busyClaim: false,
      busyAdmin: false,
      isPasswordAdmin: false,
      editingId: null,
      viewingKeys: null,
      search: "",
      filter: "all",
      discordProfile: null,
      webhookUrl: "",
      modal: null,
      createMode: "keys",
      raffleInfo: {}
    };

    let auth = null;
    let db = null;
    let unsubGiveaways = null;
    let unsubInbox = null;
    let unsubCd = null;
    let unsubDiscord = null;
    let unsubEntries = null;
    let countdownTimer = null;

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function friendlyError(err) {
      console.error("[Zenith Error]", err);
      const code = err?.code || "";
      const msg = err?.message || "";
      if (msg === "COOLDOWN" || code === "permission-denied" && msg.includes("cd")) {
        return "คุณยังติดคูลดาวน์ 24 ชั่วโมง กรุณารอให้ครบเวลาก่อนรับคีย์ถัดไป";
      }
      if (msg === "NO_KEYS") return "คีย์ในงานแจกนี้หมดแล้ว";
      if (msg === "CLOSED") return "งานแจกนี้ปิดรับแล้ว";
      if (code === "permission-denied") {
        return "ไม่มีสิทธิ์ทำรายการนี้ (อาจยังติดคูลดาวน์ 24 ชม. หรือคีย์หมดแล้ว)";
      }
      if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
        return "รหัสผ่านแอดมินไม่ถูกต้อง";
      }
      if (code === "auth/too-many-requests") {
        return "ลองเข้าสู่ระบบบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่";
      }
      if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
        return "หน้าต่างเข้าสู่ระบบถูกปิดหรือกดซ้ำ กรุณากดใหม่อีกครั้ง";
      }
      if (code === "auth/popup-blocked") {
        return "เบราว์เซอร์บล็อกหน้าต่างป๊อปอัป กรุณาอนุญาตป๊อปอัปแล้วลองใหม่";
      }
      if (code === "unavailable" || code === "failed-precondition") {
        return "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ในขณะนี้ กรุณาลองใหม่อีกครั้ง";
      }
      return "เกิดข้อผิดพลาด: " + (msg || code || "ไม่สามารถโหลดข้อมูลได้");
    }

    function formatCountdown(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function getCooldownRemainingMs() {
      if (isAdminUser()) return 0;
      if (!state.lastClaimMs) return 0;
      const diff = (state.lastClaimMs + COOLDOWN_MS) - Date.now();
      return diff > 0 ? diff : 0;
    }

    function isAdminUser() {
      return Boolean(
        state.user &&
        !state.user.isAnonymous &&
        state.user.email === ADMIN_EMAIL &&
        state.isPasswordAdmin
      );
    }

    function isRealSignedIn() {
      return Boolean(state.user && (state.discordProfile || isAdminUser()));
    }

    function getRoute() {
      const hash = window.location.hash || "#";
      if (hash === "#inbox") return { name: "inbox" };
      if (hash === "#admin") return { name: "admin" };
      if (hash.startsWith("#g-") && hash.length > 3) {
        return { name: "detail", id: decodeURIComponent(hash.slice(3)) };
      }
      return { name: "home" };
    }

    function updateNavActive(routeName) {
      const target = routeName === "detail" || routeName === "home" ? "prizes" : routeName;
      document.querySelectorAll(".nav-link").forEach((el) => {
        el.classList.toggle("active", el.dataset.nav === target);
      });
    }

    function renderConfigMissing() {
      appEl.innerHTML = `
        <div class="banner">
          <strong>ยังไม่ได้ตั้งค่า Firebase Config</strong><br />
          กรุณาเปิดไฟล์ <code>index.html</code> แล้วนำค่า <code>firebaseConfig</code> จาก Firebase Console มาวางแทนค่า <code>YOUR_...</code> ในส่วนต้นของสคริปต์
          (ดูขั้นตอนทั้งหมดได้ในไฟล์ <code>README.md</code>)
        </div>
      `;
    }

    function renderStatusBanner() {
      if (!state.statusMsg) return "";
      const cls = state.statusMsg.type === "error" ? "banner error" : "banner success";
      return `<div class="${cls}" style="margin-bottom:18px;">${esc(state.statusMsg.text)}</div>`;
    }

    function renderHome() {
      if (!state.giveawaysLoaded) {
        return `
          <div class="page-header">
            <h1>Prizes & Giveaways</h1>
            <p>กำลังโหลดรายการงานแจก...</p>
          </div>
          <div class="grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        `;
      }
      if (state.giveaways.length === 0) {
        return `
          <div class="page-header">
            <h1>Prizes & Giveaways</h1>
            <p>ยังไม่มีงานแจกในขณะนี้</p>
          </div>
          <div class="empty-state">ผู้ดูแลระบบสามารถเพิ่มงานแจกใหม่ได้ที่หน้า Admin</div>
        `;
      }

      const q = state.search.trim().toLowerCase();
      const filtered = state.giveaways.filter((g) => {
        const isRaffle = g.mode === "raffle";
        const total = Number(g.total) || 0;
        const left = Math.max(0, total - (Number(g.next) || 0));
        const isOpen = isRaffle ? Boolean(g.open) : (Boolean(g.open) && left > 0);
        if (state.filter === "open" && !isOpen) return false;
        if (state.filter === "closed" && isOpen) return false;
        if (!q) return true;
        const hay = [g.title, g.badge, ...(Array.isArray(g.chips) ? g.chips : [])]
          .join(" ")
          .toLowerCase();
        return hay.includes(q);
      });

      const totalOpen = state.giveaways.filter((g) => {
        const left = Math.max(0, (Number(g.total) || 0) - (Number(g.next) || 0));
        return g.mode === "raffle" ? Boolean(g.open) : (Boolean(g.open) && left > 0);
      }).length;
      const totalLeftKeys = state.giveaways.reduce((sum, g) => {
        if (g.mode === "raffle") return sum;
        return sum + Math.max(0, (Number(g.total) || 0) - (Number(g.next) || 0));
      }, 0);
      const totalClaimedKeys = state.giveaways.reduce((sum, g) => sum + (Number(g.next) || 0), 0);

      const cards = filtered.map((g) => {
        const isRaffle = g.mode === "raffle";
        const total = Number(g.total) || 0;
        const next = Number(g.next) || 0;
        const left = Math.max(0, total - next);
        const isOpen = isRaffle ? Boolean(g.open) : (Boolean(g.open) && left > 0);
        const chipsHtml = (Array.isArray(g.chips) ? g.chips : [])
          .map((c) => `<span class="chip">${esc(c)}</span>`)
          .join("");
        const rightMeta = isRaffle
          ? (Array.isArray(g.winners) && g.winners.length > 0 ? `ประกาศผลแล้ว (${g.winners.length})` : `สุ่ม ${g.winnerCount || 1} รางวัล`)
          : `${left} of ${total} left`;
        const coverHtml = g.imageUrl
          ? `<img class="card-cover" src="${esc(g.imageUrl)}" alt="${esc(g.title)}" loading="lazy" />`
          : "";

        return `
          <a class="card clickable" href="#g-${encodeURIComponent(g.id)}">
            ${coverHtml}
            <span class="pill">${esc(g.badge || "Giveaway")}</span>
            <h2 class="card-title">${esc(g.title)}</h2>
            ${chipsHtml ? `<div class="chips">${chipsHtml}</div>` : ""}
            <div class="card-meta">
              <span class="pill ${isOpen ? "open" : "closed"}">${isOpen ? "Open" : "Closed"}</span>
              <span>${rightMeta}</span>
            </div>
          </a>
        `;
      }).join("");

      return `
        <div class="marquee-bar">
          <div class="marquee-track">
            ZENITH DROPS • กดรับคีย์ฟรีทุก 24 ชั่วโมง • ล็อกอิน Discord เพื่อเข้าร่วมสุ่มผู้โชคดี • ขณะนี้มี ${totalOpen} งานแจกที่กำลังเปิดอยู่!
          </div>
        </div>

        <section class="hero-card">
          <div>
            <span class="pill">KEY GIVEAWAY & LUCKY DRAW</span>
            <h1>ZENITH DROPS</h1>
            <p>ศูนย์รวมแจกคีย์ฟรีและกิจกรรมสุ่มผู้โชคดี เชื่อมต่อ Discord แล้วกดรับของรางวัลเข้ากล่อง Inbox ได้ทันที</p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a href="#inbox" class="btn btn-primary" style="width:auto; padding:12px 22px;">เปิดกล่องคีย์ (Inbox)</a>
          </div>
        </section>

        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-label">งานที่เปิดอยู่ตอนนี้</div>
            <div class="stat-val">${totalOpen}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">คีย์คงเหลือทั้งหมด</div>
            <div class="stat-val">${totalLeftKeys}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">แจกออกไปแล้ว</div>
            <div class="stat-val">${totalClaimedKeys}</div>
          </div>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;">
          <input id="searchInput" class="input" style="flex:1; min-width:200px;" placeholder="ค้นหางานแจก หรือแท็ก..." value="${esc(state.search)}" />
          <div style="display:flex; gap:6px;">
            <button class="btn btn-sm" data-filter="all" style="${state.filter === "all" ? "background:#7c3aed;color:#fff;" : ""}">ทั้งหมด</button>
            <button class="btn btn-sm" data-filter="open" style="${state.filter === "open" ? "background:#16a34a;color:#fff;" : ""}">Open</button>
            <button class="btn btn-sm" data-filter="closed" style="${state.filter === "closed" ? "background:#dc2626;color:#fff;" : ""}">Closed</button>
          </div>
        </div>
        ${filtered.length === 0 ? `<div class="empty-state">ไม่พบงานแจกที่ตรงกับคำค้นหา</div>` : `<div class="grid">${cards}</div>`}
      `;
    }

    function renderDetail(id) {
      if (!state.giveawaysLoaded) {
        return `<div class="detail-wrap"><div class="empty-state">กำลังโหลดข้อมูลงานแจก...</div></div>`;
      }
      const g = state.giveaways.find((item) => item.id === id);
      if (!g) {
        return `
          <div class="detail-wrap">
            <a href="#" class="back-link">← กลับหน้ารวมงานแจก</a>
            <div class="empty-state">ไม่พบงานแจกนี้ หรืออาจถูกลบไปแล้ว</div>
          </div>
        `;
      }

      const isRaffle = g.mode === "raffle";
      const total = Math.max(0, Number(g.total) || 0);
      const next = Math.max(0, Number(g.next) || 0);
      const left = Math.max(0, total - next);
      const isEnded = isRaffle ? !g.open : (!g.open || left <= 0);

      const r = 74;
      const circumference = 2 * Math.PI * r;
      const ratio = isRaffle ? (isEnded ? 0 : 1) : (total > 0 ? left / total : 0);
      const dashOffset = circumference * (1 - ratio);

      const statusLabel = isEnded ? "Closed" : "Open";
      const allChips = [
        `<span class="pill ${isEnded ? "closed" : "open"}">${statusLabel}</span>`,
        ...(isRaffle ? [`<span class="chip">Lucky Draw • ${g.winnerCount || 1} Winners</span>`] : []),
        ...(Array.isArray(g.chips) ? g.chips.map((c) => `<span class="chip">${esc(c)}</span>`) : [])
      ].join("");

      const rInfo = state.raffleInfo[g.id] || { count: 0, joined: false };
      const winnersList = Array.isArray(g.winners) ? g.winners : [];
      const cdMs = getCooldownRemainingMs();
      let actionHtml = "";

      if (isRaffle) {
        if (winnersList.length > 0) {
          actionHtml = `
            <div class="claimed-box" style="border-color:rgba(217,119,6,0.4); background:#fffbeb;">
              <div style="font-size:0.92rem; color:#92400e; font-weight:700; margin-bottom:8px;">ผู้โชคดีที่ได้รับรางวัล</div>
              ${winnersList.map((w, i) => `
                <div class="key-row" style="margin-top:6px;">
                  <span class="key-code">#${i + 1} @${esc(w.discordUsername)}</span>
                  <span class="muted" style="font-size:0.78rem;">ID: ${esc(w.discordId)}</span>
                </div>
              `).join("")}
            </div>
          `;
        } else if (isEnded) {
          actionHtml = `
            <div class="ended-box">
              <strong>This giveaway has ended</strong>
              It is no longer accepting entries.
            </div>
          `;
        } else if (!isRealSignedIn() || !state.discordProfile) {
          actionHtml = `
            <button id="connectDiscordBtn" class="btn btn-primary" style="background:linear-gradient(135deg,#5865F2 0%,#4752C4 100%);">
              Login Discord เพื่อเข้าร่วมสุ่ม
            </button>
          `;
        } else if (rInfo.joined) {
          actionHtml = `
            <button class="btn btn-primary" disabled>
              เข้าร่วมแล้ว (@${esc(state.discordProfile.username)})
            </button>
          `;
        } else {
          actionHtml = `
            <button id="joinRaffleBtn" class="btn btn-primary" ${state.busyClaim ? "disabled" : ""}>
              ${state.busyClaim ? "กำลังบันทึก..." : `เข้าร่วมสุ่มรางวัล (@${esc(state.discordProfile.username)})`}
            </button>
          `;
        }
      } else if (isEnded) {
        actionHtml = `
          <div class="ended-box">
            <strong>This giveaway has ended</strong>
            It is no longer handing out keys.
          </div>
        `;
      } else if (!isRealSignedIn()) {
        actionHtml = `
          <button id="connectDiscordBtn" class="btn btn-primary" style="background:linear-gradient(135deg,#5865F2 0%,#4752C4 100%);">
            Login Discord to Claim
          </button>
        `;
      } else if (cdMs > 0) {
        actionHtml = `
          <button id="claimBtn" class="btn btn-primary" disabled>
            Next claim in ${formatCountdown(cdMs)}
          </button>
        `;
      } else {
        actionHtml = `
          <button id="claimBtn" class="btn btn-primary" ${state.busyClaim ? "disabled" : ""}>
            ${state.busyClaim ? "กำลังรับคีย์..." : "Claim key"}
          </button>
        `;
      }

      const claimedHtml = state.lastClaimedResult && state.lastClaimedResult.gid === g.id
        ? `
          <div class="claimed-box">
            <div style="font-size:0.86rem; color:#15803d; font-weight:600;">รับคีย์สำเร็จ! บันทึกลง Inbox แล้ว</div>
            <div class="key-row">
              <span class="key-code">${esc(state.lastClaimedResult.key)}</span>
              <button class="btn btn-sm" data-copy="${esc(state.lastClaimedResult.key)}">Copy</button>
            </div>
          </div>
        `
        : "";

      return `
        <div class="detail-wrap">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <a href="#" class="back-link" style="margin-bottom:0;">← กลับหน้ารวมงานแจก</a>
            <button type="button" id="shareLinkBtn" class="btn btn-sm">แชร์ลิงก์</button>
          </div>
          <div class="detail-card">
            <span class="pill">${esc(g.badge || "Giveaway")}</span>
            <h1 class="detail-title">${esc(g.title)}</h1>

            <div class="ring-box">
              <svg class="ring-svg" viewBox="0 0 176 176">
                <circle class="ring-bg" cx="88" cy="88" r="${r}" />
                <circle
                  class="ring-fg ${isEnded ? "empty" : ""}"
                  cx="88"
                  cy="88"
                  r="${r}"
                  stroke-dasharray="${circumference.toFixed(2)}"
                  stroke-dashoffset="${dashOffset.toFixed(2)}"
                />
              </svg>
              <div class="ring-center">
                <span class="ring-num">${isRaffle ? rInfo.count : left}</span>
                <span class="ring-sub">${isRaffle ? "joined" : `of ${total} left`}</span>
              </div>
            </div>

            <div class="chips detail-chips">${allChips}</div>
            ${actionHtml}
            ${claimedHtml}
          </div>
        </div>
      `;
    }

    function renderInbox() {
      if (!state.authReady) {
        return `<div class="stack"><div class="empty-state">กำลังตรวจสอบสิทธิ์ผู้ใช้...</div></div>`;
      }
      if (!isRealSignedIn()) {

    function launchConfetti() {
      const canvas = document.createElement("canvas");
      canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100;";
      document.body.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ["#60a5fa", "#3b82f6", "#22c55e", "#fde047", "#818cf8", "#f472b6"];
      const pieces = Array.from({ length: 85 }, () => ({
        x: canvas.width * (0.2 + Math.random() * 0.6),
        y: canvas.height * 0.45,
        vx: (Math.random() - 0.5) * 12,
        vy: -Math.random() * 11 - 4,
        w: 6 + Math.random() * 6,
        h: 4 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.2,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));
      let frame = 0;
      function tick() {
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of pieces) {
          p.vy += 0.32;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        if (frame < 110) requestAnimationFrame(tick);
        else canvas.remove();
      }
      requestAnimationFrame(tick);
    }

    function bindViewEvents(route) {
      document.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const val = btn.getAttribute("data-copy");
          try {
            await navigator.clipboard.writeText(val);
            const orig = btn.textContent;
            btn.textContent = "Copied!";
            showToast("คัดลอกแล้ว!");
            setTimeout(() => { btn.textContent = orig; }, 1200);
          } catch {
            showToast("คัดลอกไม่สำเร็จ", "error");
          }
        });
      });

      if (route.name === "home") {
        const searchInput = document.getElementById("searchInput");
        if (searchInput) {
          searchInput.addEventListener("input", (e) => {
            state.search = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const nextInput = document.getElementById("searchInput");
            if (nextInput) {
              nextInput.focus();
              nextInput.setSelectionRange(pos, pos);
            }
          });
        }
        document.querySelectorAll("[data-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.filter = btn.getAttribute("data-filter");
            render();

        });
      }

      if (route.name === "inbox") {

      if (route.name === "detail") {

    async function handleUserSignOut() {
      state.statusMsg = null;
      state.inbox = [];
      state.lastClaimMs = 0;
      state.discordProfile = null;
      localStorage.removeItem("zenith_discord_profile");
      await signOut(auth);
      render();
    }

    async function handleClaim(gid) {
      if (state.busyClaim) return;
      if (!isRealSignedIn()) {
        handleConnectDiscord();
        return;
      }
      state.statusMsg = null;
      state.busyClaim = true;
      render();

      try {
        const uid = auth.currentUser.uid;
        const adminMode = isAdminUser();
        const giveawayRef = doc(db, "giveaways", gid);
        const cdRef = doc(db, "users", uid, "cd", "state");

        const result = await runTransaction(db, async (tx) => {
          const gSnap = await tx.get(giveawayRef);
          if (!gSnap.exists()) throw new Error("ไม่พบงานแจกนี้");
          const gData = gSnap.data();
          if (!gData.open) throw new Error("CLOSED");
          const next = Number(gData.next) || 0;
          const total = Number(gData.total) || 0;
          if (next >= total) throw new Error("NO_KEYS");

          if (!adminMode) {
            const cdSnap = await tx.get(cdRef);
            if (cdSnap.exists()) {
              const lastTs = cdSnap.data().last;
              const lastMs = lastTs?.toMillis ? lastTs.toMillis() : 0;
              if (lastMs && Date.now() - lastMs < COOLDOWN_MS) {
                throw new Error("COOLDOWN");
              }
            }
          }

          const keyRef = doc(db, "giveaways", gid, "keys", String(next));
          const keySnap = await tx.get(keyRef);
          if (!keySnap.exists()) throw new Error("NO_KEYS");

          const claimedKey = keySnap.data().v;
          const inboxRef = doc(collection(db, "users", uid, "inbox"));

          tx.update(giveawayRef, { next: next + 1 });
          if (!adminMode) {
            tx.set(cdRef, { last: serverTimestamp() });
          }
          tx.set(inboxRef, {
            gid,
            title: gData.title || "Giveaway",
            key: claimedKey,
            at: serverTimestamp()
          });

          return { gid, key: claimedKey };
        });

        state.lastClaimedResult = result;
        if (!adminMode) {
          state.lastClaimMs = Date.now();
        }
        launchConfetti();
        showToast("รับคีย์สำเร็จ!");
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
      } finally {
        state.busyClaim = false;
        render();
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const pass = document.getElementById("adminPass").value;
      state.statusMsg = null;
      state.busyAdmin = true;
      render();

      try {
        if (auth.currentUser) {
          await signOut(auth);
        }
        await Promise.race([
          signInWithEmailAndPassword(auth, ADMIN_EMAIL, pass),
          new Promise((_, reject) => setTimeout(() => reject(new Error("การเชื่อมต่อช้าเกินไป กรุณาลองใหม่อีกครั้ง")), 12000))
        ]);
        state.statusMsg = { type: "success", text: "เข้าสู่ระบบแอดมินสำเร็จ" };
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
      } finally {
        state.busyAdmin = false;
        render();
      }
    }

    async function handleAdminLogout() {
      state.statusMsg = null;
      state.editingId = null;
      state.viewingKeys = null;
      await signOut(auth);
      render();
    }

    async function handleViewRemainingKeys(gid) {
      const target = state.giveaways.find((g) => g.id === gid);
      if (!target) return;
      state.statusMsg = null;
      try {
        const snap = await getDocs(collection(db, "giveaways", gid, "keys"));
        const nextIdx = Number(target.next) || 0;
        const remaining = snap.docs
          .map((d) => ({ idx: Number(d.id), v: d.data().v }))
          .filter((item) => Number.isFinite(item.idx) && item.idx >= nextIdx)
          .sort((a, b) => a.idx - b.idx)
          .map((item) => item.v);
        state.viewingKeys = { gid, title: target.title, keys: remaining };
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
        render();
      }
    }

    function handleConnectDiscord() {
      state.statusMsg = null;
      if (!DISCORD_CLIENT_ID || DISCORD_CLIENT_ID.includes("YOUR_")) {
        state.statusMsg = { type: "error", text: "ยังไม่ได้ตั้งค่า DISCORD_CLIENT_ID ใน index.html" };
        render();
        return;
      }
      sessionStorage.setItem("zenith_post_discord_hash", window.location.hash || "#");
      const redirectUri = window.location.origin + window.location.pathname;
      const url = `https://discord.com/oauth2/authorize?client_id=${encodeURIComponent(DISCORD_CLIENT_ID)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=identify`;
      window.location.href = url;
    }

    function captureDiscordHashOnBoot() {
      const h = window.location.hash || "";
      if (!h.includes("access_token=")) return;
      const params = new URLSearchParams(h.replace(/^#/, ""));
      const token = params.get("access_token");
      if (token) {
        sessionStorage.setItem("zenith_discord_token", token);
      }
      const backHash = sessionStorage.getItem("zenith_post_discord_hash") || "#";
      sessionStorage.removeItem("zenith_post_discord_hash");
      window.history.replaceState({}, document.title, window.location.origin + window.location.pathname + backHash);
    }

    async function syncDiscordTokenIfNeeded() {
      const token = sessionStorage.getItem("zenith_discord_token");
      if (!token) return;
      sessionStorage.removeItem("zenith_discord_token");
      try {
        const res = await fetch("https://discord.com/api/users/@me", {
          headers: { Authorization: `Bearer ${token}` }
        });
        const dUser = await res.json();
        if (!res.ok || !dUser.id) throw new Error("ดึงข้อมูล Discord ไม่สำเร็จ");
        const username = dUser.global_name || dUser.username || `User#${dUser.id}`;
        const profile = { id: dUser.id, username, avatar: dUser.avatar || "" };
        localStorage.setItem("zenith_discord_profile", JSON.stringify(profile));
        state.discordProfile = profile;

        if (!auth.currentUser) {
          await signInAnonymously(auth);
        }
        const uid = auth.currentUser?.uid;
        if (uid) {
          await setDoc(doc(db, "users", uid, "profile", "discord"), {
            ...profile,
            updatedAt: serverTimestamp()
          });
        }
        state.statusMsg = { type: "success", text: `เข้าสู่ระบบ Discord (@${username}) เรียบร้อยแล้ว` };
        render();
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
        render();
      }
    }

    async function handleJoinRaffle(gid) {
      if (state.busyClaim) return;
      if (!isRealSignedIn() || !state.discordProfile) { handleConnectDiscord(); return; }

      state.statusMsg = null;
      state.busyClaim = true;
      render();
      try {
        const uid = auth.currentUser.uid;
        const discordId = state.discordProfile.id;
        await setDoc(doc(db, "giveaways", gid, "entries", discordId), {
          uid,
          discordId,
          discordUsername: state.discordProfile.username,
          at: serverTimestamp()
        });
        state.statusMsg = { type: "success", text: `เข้าร่วมสุ่มรางวัลด้วยบัญชี @${state.discordProfile.username} แล้ว!` };
      } catch (err) {
        if (err?.code === "permission-denied") {
          state.statusMsg = { type: "error", text: "บัญชี Discord นี้เข้าร่วมงานสุ่มนี้ไปแล้ว (1 บัญชี Discord = 1 สิทธิ์)" };
        } else {
          state.statusMsg = { type: "error", text: friendlyError(err) };
        }
      } finally {
        state.busyClaim = false;
        render();
      }
    }

    async function handleSaveWebhook(e) {
      e.preventDefault();
      const url = document.getElementById("webhookInput").value.trim();
      state.statusMsg = null;
      try {
        await setDoc(doc(db, "admin", "config"), { webhookUrl: url });
        state.webhookUrl = url;
        state.statusMsg = { type: "success", text: "บันทึก Discord Webhook แล้ว" };
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
      }
      render();
    }

    async function handleDrawWinners(gid, isReroll = false) {
      const target = state.giveaways.find((g) => g.id === gid);
      if (!target) return;
      state.statusMsg = null;
      state.busyAdmin = true;
      render();

      try {
        const snap = await getDocs(collection(db, "giveaways", gid, "entries"));
        let entries = snap.docs.map((d) => ({ uid: d.id, ...d.data() }));
        if (isReroll && Array.isArray(target.winners) && target.winners.length > 0) {
          const prevIds = new Set(target.winners.map((w) => w.discordId));
          const remaining = entries.filter((e) => !prevIds.has(e.discordId));
          if (remaining.length > 0) entries = remaining;
        }
        if (entries.length === 0) {
          throw new Error("ยังไม่มีผู้เข้าร่วมในงานนี้");
        }
        const count = Math.min(entries.length, Math.max(1, Number(target.winnerCount) || 1));
        for (let i = entries.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [entries[i], entries[j]] = [entries[j], entries[i]];
        }
        const winners = entries.slice(0, count).map((e) => ({
          discordId: e.discordId,
          discordUsername: e.discordUsername
        }));

        await updateDoc(doc(db, "giveaways", gid), {
          winners,
          open: false
        });

        if (state.webhookUrl) {
          const mentions = winners.map((w, i) => `**#${i + 1}** <@${w.discordId}> (\`${w.discordUsername}\`)`).join("\n");
          await fetch(state.webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              content: winners.map((w) => `<@${w.discordId}>`).join(" "),
              embeds: [{
                title: `${isReroll ? "Reroll ผู้โชคดีใหม่" : "ประกาศผู้โชคดี"}: ${target.title}`,
                description: mentions,
                color: 5793266,
                footer: { text: `${target.badge || "Zenith Drops"} • ผู้เข้าร่วมทั้งหมด ${snap.size} คน` }
              }]
            })
          });
        }

        launchConfetti();
        state.statusMsg = {
          type: "success",
          text: `${isReroll ? "Reroll " : ""}สุ่มผู้โชคดี ${winners.length} คนสำเร็จ: ${winners.map((w) => "@" + w.discordUsername).join(", ")}`
        };
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
      } finally {
        state.busyAdmin = false;
        render();
      }
    }

    async function handleCreateGiveaway(e) {
      e.preventDefault();
      const mode = document.getElementById("gMode")?.value || "keys";
      const title = document.getElementById("gTitle").value.trim();
      const badge = document.getElementById("gBadge").value.trim();
      const chipsRaw = document.getElementById("gChips").value;
      const imageUrl = document.getElementById("gImage")?.value.trim() || "";
      const chips = chipsRaw.split(",").map((s) => s.trim()).filter(Boolean);

      if (mode === "raffle") {
        const winnerCount = Math.max(1, Number(document.getElementById("gWinners")?.value) || 1);
        if (!title || !badge) {
          state.statusMsg = { type: "error", text: "กรุณากรอกชื่องานแจกและชื่อสินค้า" };
          render();
          return;
        }
        state.statusMsg = null;
        state.busyAdmin = true;
        render();
        try {
          await addDoc(collection(db, "giveaways"), {
            mode: "raffle",
            title,
            badge,
            chips,
            imageUrl,
            winnerCount,
            winners: [],
            total: 0,
            next: 0,
            open: true,
            createdAt: serverTimestamp()
          });
          state.statusMsg = { type: "success", text: `สร้างงานสุ่มผู้โชคดี "${title}" (${winnerCount} รางวัล) แล้ว` };
        } catch (err) {
          state.statusMsg = { type: "error", text: friendlyError(err) };
        } finally {
          state.busyAdmin = false;
          render();
        }
        return;
      }

      const keysRaw = document.getElementById("gKeys").value;
      const shouldShuffle = Boolean(document.getElementById("gShuffle")?.checked);
      const keys = keysRaw
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean);

      if (shouldShuffle && keys.length > 1) {
        for (let i = keys.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [keys[i], keys[j]] = [keys[j], keys[i]];
        }
      }

      if (!title || !badge || keys.length === 0) {
        state.statusMsg = { type: "error", text: "กรุณากรอกข้อมูลให้ครบและใส่คีย์อย่างน้อย 1 ชิ้น" };
        render();
        return;
      }

      state.statusMsg = null;
      state.busyAdmin = true;
      render();

      try {
        const gDocRef = await addDoc(collection(db, "giveaways"), {
          mode: "keys",
          title,
          badge,
          chips,
          imageUrl,
          total: keys.length,
          next: 0,
          open: true,
          createdAt: serverTimestamp()
        });

        // เขียนคีย์ทีละชุด (ไม่เกิน 450 ต่อ batch)
        const CHUNK = 450;
        for (let i = 0; i < keys.length; i += CHUNK) {
          const batch = writeBatch(db);
          const slice = keys.slice(i, i + CHUNK);
          slice.forEach((val, offset) => {
            const idx = String(i + offset);
            batch.set(doc(db, "giveaways", gDocRef.id, "keys", idx), { v: val });
          });
          await batch.commit();
        }

        state.statusMsg = { type: "success", text: `สร้างงาน "${title}" พร้อมคีย์ ${keys.length} ชิ้นแล้ว` };
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
      } finally {
        state.busyAdmin = false;
        render();
      }
    }

    async function handleToggleOpen(gid, nextOpen) {
      state.statusMsg = null;
      try {
        await updateDoc(doc(db, "giveaways", gid), { open: nextOpen });
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
        render();
      }
    }

    async function handleEditGiveaway(e) {
      e.preventDefault();
      const gid = state.editingId;
      const target = state.giveaways.find((g) => g.id === gid);
      if (!target) return;

      const title = document.getElementById("eTitle").value.trim();
      const badge = document.getElementById("eBadge").value.trim();
      const imageUrl = document.getElementById("eImage")?.value.trim() || "";
      const chips = document.getElementById("eChips").value
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);
      const addKeys = document.getElementById("eAddKeys").value
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean);

      if (!title || !badge) {
        state.statusMsg = { type: "error", text: "กรุณากรอกชื่องานแจกและชื่อสินค้า" };
        render();
        return;
      }

      state.statusMsg = null;
      state.busyAdmin = true;
      render();

      try {
        const oldTotal = Number(target.total) || 0;
        const CHUNK = 450;
        for (let i = 0; i < addKeys.length; i += CHUNK) {
          const batch = writeBatch(db);
          const slice = addKeys.slice(i, i + CHUNK);
          slice.forEach((val, offset) => {
            const idx = String(oldTotal + i + offset);
            batch.set(doc(db, "giveaways", gid, "keys", idx), { v: val });
          });
          await batch.commit();
        }

        await updateDoc(doc(db, "giveaways", gid), {
          title,
          badge,
          chips,
          imageUrl,
          total: oldTotal + addKeys.length
        });

        state.editingId = null;
        state.statusMsg = {
          type: "success",
          text: addKeys.length > 0
            ? `บันทึกการแก้ไขและเพิ่มคีย์ใหม่ ${addKeys.length} ชิ้นแล้ว`
            : "บันทึกการแก้ไขงานแจกเรียบร้อยแล้ว"
        };
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
      } finally {
        state.busyAdmin = false;
        render();
      }
    }

    async function handleDeleteGiveaway(gid) {
      if (!confirm("ยืนยันการลบงานแจกนี้และคีย์ทั้งหมดภายในงาน?")) return;
      state.statusMsg = null;
      try {
        const keysSnap = await getDocs(collection(db, "giveaways", gid, "keys"));
        const entriesSnap = await getDocs(collection(db, "giveaways", gid, "entries"));
        const docs = [...keysSnap.docs, ...entriesSnap.docs];
        const CHUNK = 450;
        for (let i = 0; i < docs.length; i += CHUNK) {
          const batch = writeBatch(db);
          docs.slice(i, i + CHUNK).forEach((d) => batch.delete(d.ref));
          await batch.commit();
        }
        await deleteDoc(doc(db, "giveaways", gid));
        state.statusMsg = { type: "success", text: "ลบงานแจกเรียบร้อยแล้ว" };
        render();
      } catch (err) {
        state.statusMsg = { type: "error", text: friendlyError(err) };
        render();
      }
    }

    function attachUserListeners(uid) {
      if (unsubInbox) unsubInbox();
      if (unsubCd) unsubCd();
      if (unsubDiscord) unsubDiscord();

      const inboxQ = query(collection(db, "users", uid, "inbox"), orderBy("at", "desc"));
      unsubInbox = onSnapshot(inboxQ, (snap) => {
        state.inbox = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        if (getRoute().name === "inbox") render();
      });

      unsubCd = onSnapshot(doc(db, "users", uid, "cd", "state"), (snap) => {
        if (snap.exists() && snap.data().last?.toMillis) {
          state.lastClaimMs = snap.data().last.toMillis();
        } else {
          state.lastClaimMs = 0;
        }
        if (getRoute().name === "detail") render();
      });

      unsubDiscord = onSnapshot(doc(db, "users", uid, "profile", "discord"), (snap) => {
        state.discordProfile = snap.exists() ? snap.data() : null;
        render();
      });
    }

    function attachDetailEntriesListener(gid) {
      if (unsubEntries) unsubEntries();
      unsubEntries = null;
      if (!gid || !isRealSignedIn()) return;
      unsubEntries = onSnapshot(collection(db, "giveaways", gid, "entries"), (snap) => {
        const uid = auth.currentUser?.uid;
        const dId = state.discordProfile?.id;
        state.raffleInfo[gid] = {
          count: snap.size,
          joined: snap.docs.some((d) => (dId && d.id === dId) || d.data().uid === uid)
        };
        if (getRoute().name === "detail") render();
      });
    }

    function startCountdownTick() {
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        if (getRoute().name !== "detail") return;
        const btn = document.getElementById("claimBtn");
        if (!btn) return;
        const cdMs = getCooldownRemainingMs();
        if (cdMs > 0) {
          btn.disabled = true;
          btn.textContent = `Next claim in ${formatCountdown(cdMs)}`;
        } else if (btn.disabled && btn.textContent.startsWith("Next claim in")) {
          render();
        }
      }, 1000);
    }

    function boot() {
      captureDiscordHashOnBoot();

      window.addEventListener("hashchange", () => {
        state.statusMsg = null;
        const r = getRoute();
        if (r.name === "detail") attachDetailEntriesListener(r.id);
        render();
      });

      if (!isConfigured) {
        render();
        return;
      }

      const app = initializeApp(firebaseConfig);
      if (RECAPTCHA_SITE_KEY) {
        initializeAppCheck(app, {
          provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
          isTokenAutoRefreshEnabled: true
        });
      }
      auth = getAuth(app);
      db = getFirestore(app);

      const gQuery = query(collection(db, "giveaways"), orderBy("createdAt", "desc"));
      unsubGiveaways = onSnapshot(
        gQuery,
        (snap) => {
          state.giveaways = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          state.giveawaysLoaded = true;
          render();
        },
        (err) => {
          state.statusMsg = { type: "error", text: friendlyError(err) };
          state.giveawaysLoaded = true;
          render();
        }
      );

      onAuthStateChanged(auth, async (user) => {
        if (!user && localStorage.getItem("zenith_discord_profile")) {
          try {
            await signInAnonymously(auth);
          } catch { }
          return;
        }
        state.user = user || null;
        if (!state.discordProfile) {
          try {
            const cached = localStorage.getItem("zenith_discord_profile");
            if (cached) state.discordProfile = JSON.parse(cached);
          } catch { }
        }
        if (user && user.email === ADMIN_EMAIL) {
          try {
            const tokenRes = await user.getIdTokenResult();
            state.isPasswordAdmin = tokenRes.signInProvider === "password";
          } catch {
            state.isPasswordAdmin = false;
          }
        } else {
          state.isPasswordAdmin = false;
        }
        state.authReady = true;
        state.busyAdmin = false;
        if (user) {
          attachUserListeners(user.uid);
          const r = getRoute();
          if (r.name === "detail") attachDetailEntriesListener(r.id);
          if (state.isPasswordAdmin) {
            getDoc(doc(db, "admin", "config")).then((s) => {
              if (s.exists()) state.webhookUrl = s.data().webhookUrl || "";
            }).catch(() => { });
          }
        } else {
          if (unsubInbox) unsubInbox();
          if (unsubCd) unsubCd();
          if (unsubDiscord) unsubDiscord();
          if (unsubEntries) unsubEntries();
          state.inbox = [];
          state.lastClaimMs = 0;
        }
        render();
      });

      syncDiscordTokenIfNeeded();
      startCountdownTick();
      render();
    }

    boot();
  </script>
</body>
